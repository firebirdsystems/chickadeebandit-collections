<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collections</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: var(--hub-tint-danger-fg, #b91c1c);
      --red-soft: var(--hub-tint-danger, #fee2e2);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
      /* What a photo sits on. A cutout is transparent, so this is its backdrop. */
      --plinth: color-mix(in srgb, var(--surface) 90%, var(--text));
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app { max-width: 880px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .topbar-main { min-width: 0; }
    h1 { font-size: 1.35rem; line-height: 1.2; overflow-wrap: anywhere; }
    h2 { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin: 18px 0 8px; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .back { background: none; border: 0; color: var(--muted); font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; padding: 0; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 4px; }
    .back:hover { color: var(--text); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg); white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--plinth); }
    .btn-sm { min-height: 30px; padding: 4px 9px; font-size: .78rem; }
    .btn-quiet-danger { min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted); border: 0; font-size: .76rem; font-weight: 700; }
    .btn-quiet-danger:hover { background: var(--red-soft); color: var(--red); }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .field { display: grid; gap: 4px; margin-bottom: 10px; }
    label, .label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input[type="text"], input[type="search"], input[type="date"], textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 60px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    /* A box holding an edit that could not be saved. */
    input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--red); }
    .check { display: flex; align-items: flex-start; gap: 8px; font-size: .88rem; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 400; }
    .check input { margin-top: 4px; }
    .search-row { margin-bottom: 12px; }
    .search-input { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .empty p { margin: 12px 0 0; }
    .error, .notice { padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .error { background: var(--red-soft); color: var(--red); }
    .notice { background: var(--plinth); }
    .dismiss { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; font-weight: 800; padding: 0 2px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; text-align: left; font: inherit; color: inherit; padding: 0; display: flex; flex-direction: column; }
    .tile:hover { border-color: var(--border-mid); }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .plinth { aspect-ratio: 1; background: var(--plinth); display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; overflow: hidden; }
    .plinth img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* A cutout is drawn whole, standing on the plinth, with the shadow the
       removed background used to give it. */
    .plinth img.cutout { object-fit: contain; padding: 9%; filter: drop-shadow(0 5px 6px rgba(15, 23, 42, .22)); }
    .plinth .placeholder { font-size: 2.2rem; opacity: .55; }
    .tile-body { padding: 9px 11px 11px; min-width: 0; }
    .tile-title { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
    .tile-meta { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .badge { position: absolute; left: 6px; bottom: 6px; background: var(--surface); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 700; box-shadow: var(--shadow); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1.5px solid var(--border-mid); background: var(--surface); color: var(--text); border-radius: 999px; padding: 3px 11px; font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .chip:hover { border-color: var(--accent); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .chip.static { cursor: default; }
    .chip.static:hover { border-color: var(--border-mid); }
    .chip .count { opacity: .65; font-weight: 400; }
    .chip-x { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; font-weight: 800; padding: 0; opacity: .6; }
    .chip-x:hover { opacity: 1; }
    .filters { display: grid; gap: 8px; margin-bottom: 12px; }
    .filter-line { display: flex; gap: 8px; align-items: baseline; }
    .filter-line .label { flex: 0 0 auto; min-width: 46px; }
    .add-inline { display: flex; gap: 6px; margin-top: 8px; }
    .add-inline input { min-width: 0; }

    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; z-index: 10; }
    .sheet { background: var(--surface); border-radius: 12px; width: 100%; max-width: 560px; padding: 16px; box-shadow: 0 12px 40px rgba(15, 23, 42, .25); margin: auto 0; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .photo { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .photo-foot { padding: 6px 8px 8px; display: grid; gap: 6px; }
    .photo-foot .row { gap: 4px; }
    .spin { display: inline-block; width: .8em; height: .8em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    input[type="file"] { display: none; }
  </style>
  <base href="/run/collections/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>
<div id="modal"></div>

<script type="module">
import {
  createDbHelper, createFilesHelper, esc, searchMatch, hubConfirm, glyph, chickadee,
  createShareHelper, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS, heicAsJpeg,
} from "/hub-sdk.js";
import {
  canEdit as _canEdit, parseIds, toggleId, liveIds, findByName, tagsOf, searchableFields, filterItems, countByLabel,
  photosOf, coverPhoto, collectionCover, cutoutState, canRequestCutout, showsCutout, displayFileId, cutoutFailure,
  cutoutLabel, plural, holdIsFresh, cleanDate, formatDate, withoutDeleted, pendingElsewhere, needsCheck, holdKey, PENDING_TIMEOUT_MS,
  coverWrites, isAdult, cutoutIsUnnamed, isHeic, storedAsHeic, heicRefusal, heicKeptRefusal, cutoutSupported, missingCutoutThumbs, withNoThumb, intoHeld, carriedOver,
  wroteNothing, imageRetryDelay,
} from "./logic.js";
import { createShareUi, createOverlayView } from "/hub-share-ui.js";
import { firstRenderBatch, namedResults, nextPageBatch, FIRST_PAGE_SIZE, NEXT_PAGE_SIZE } from "./reads.js";

// --- Hub runtime globals (empty in demo mode) --------------------------------
const CONTEXT = window.__CONTEXT_URL ?? "";
const DB_URL = window.__DB_URL ?? "";
const FILES_URL = window.__FILES_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

const db = createDbHelper(DB_URL);
const files = FILES_URL ? createFilesHelper(FILES_URL) : null;

// The hub allows a member a fixed number of file requests a minute. A burst of
// photos can pass it; the request is worth making again after a pause.
// The limit is counted over a minute, so the pauses together outlast one.
const RATE_LIMIT_PAUSE_MS = 20_000;
const RATE_LIMIT_RETRIES = 4;
// The hub asks for five seconds when a photo's cutout is already being made.
const CUTOUT_BUSY_PAUSE_MS = 6_000;

// --- App state ---------------------------------------------------------------
let memberMap = new Map();
// Known from the start inside the hub; in demo mode, once the members are read.
// Inside the hub it is whoever the hub says is looking and nobody else. With
// no member the app only shows: the first of the household's members is a
// different person, and rows drawn as theirs would not be theirs in the hub.
let me = HUB_MEMBER;
let collections = [];
let tags = [];
let locations = [];
let items = [];
let photos = [];

let view = { name: "home" };          // home | collection | location
let sheet = null;                      // null | { kind: "collection", id? } | { kind: "item", id }
let filterTags = [];
let filterLocations = [];
let searchQ = "";
let error = "";
let notice = "";
let adding = null;                     // { done, total } while photos are uploading

// Photos whose cutout THIS tab asked for, with the `cutout_requested_at` it
// wrote when it took the row. A `pending` row in here is ours to finish; one
// that is not belongs to another tab, or to a tab that has closed. The stamp is
// how a later write proves the row is still ours.
const mine = new Map();
// Ids deleted in this visit. Older rows are still being read behind the first
// paint, and a page asked for before a delete must not bring the row back.
const gone = { collections: new Set(), items: new Set(), photos: new Set() };
// True while a form's write is on its way, so a second Enter adds nothing.
let submitting = false;
// Every write to an item (its name, notes, date, tags and places) runs after
// the one before it. Two edits to the same box are then stored in the order
// they were made, and a change to the tags starts from what the last one saved.
let itemWrites = Promise.resolve();
let cutoutsStopped = false;
let cutoutChain = Promise.resolve();
// True once every page of items and photos has been read. Until then an item
// can look as though it has no photos, and its cover must not be written.
let loadedAll = false;
// The last page read of each table and the size it was asked for, so that
// reading can pick up where a failed request left off.
let restPages = {};
let restSize = FIRST_PAGE_SIZE;
let restLoad = null;
// True while the error on show is a failed read of the household's rows. Only
// that one is taken down when a later try succeeds; an error about anything
// else (an edit that was not saved) stays until it is dismissed.
let errorIsLoad = false;
// Whether the members and the first page of rows have been read.
let membersLoaded = false;
let firstLoaded = false;
let firstLoad = null;
let coverSync = Promise.resolve();
// False while a cover is known or suspected to be out of date: the pages are
// not all read, or a write of one failed.
let coversCurrent = false;
let coverRetry = 0;
// True once a cover write that matched no row has had the rows read again
// for it, so that a write that keeps matching none is left to the slow retry.
let coverMissRead = false;
let sharing = false;
// Counts the times the first page has been read. A later page asked for
// before the rows were read again belongs to the reading before, and is dropped.
let readEpoch = 0;
// True while the rows are to be read again from the start.
let rereadOwed = false;
// Items and photos held from before the rows were read again that the first
// page did not have, by id, until a later page has them or every page is in.
let carried = { items: new Set(), photos: new Set() };
// Why the members could not be read, or "" once they have been.
let membersFailure = "";
// Failed reads already said. A try comes round every half minute, and one
// that fails the way an earlier one did is not put back up once dismissed.
const loadErrorsTold = new Set();
// The first page could not be read, and has not been since: the banner is up.
let firstLoadFailed = false;
// An item's name, notes or date typed into the open sheet and not saved,
// as `${itemId}|${column}`. Tried again when the box is left or the sheet closed.
const unsaved = new Set();
// The same, for each edit on its way to being saved: how many saves of it are
// queued or with the hub. Its box holds what is being stored, not what a read
// made meanwhile would say.
const saving = new Map();
// How many edits to an item's name, notes or date have been stored.
let itemEdits = 0;
// Photos whose cutout the hub answered for with no small copy to keep. They
// are remembered on this device, which may refuse to: then they are asked
// about once a visit.
const NO_THUMB_KEY = "collections.cutouts-without-thumb";
function noThumbRemembered() {
  try { return parseIds(localStorage.getItem(NO_THUMB_KEY)); } catch { return []; }
}
function rememberNoThumb(id) {
  try { localStorage.setItem(NO_THUMB_KEY, JSON.stringify(withNoThumb(noThumbRemembered(), id))); } catch { /* asked again next visit */ }
}
// Photos asked about again in this visit for the small copy of their cutout,
// and those remembered as taking none.
const thumbsTried = new Set(noThumbRemembered());
let thumbsFilling = false;
let thumbsStopped = false;
// How many times each picture that failed to load has been asked for again,
// by address, and the addresses waiting to be asked for.
const imageTries = new Map();
const imageWaits = new Set();

const nowIso = () => new Date().toISOString();
const canEdit = (row) => _canEdit(row, me);
const byId = (rows, id) => rows.find((row) => row.id === id) ?? null;
const memberName = (id) => memberMap.get(id)?.name ?? "Someone";
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
// A request made behind the scenes that has had no answer in this long is
// given up on, so that whatever waits on it can try again. One that is never
// answered at all would otherwise hold up every later one for the whole visit.
const BACKGROUND_TIMEOUT_MS = 45_000;
const answered = (request) => Promise.race([
  request,
  wait(BACKGROUND_TIMEOUT_MS).then(() => { throw new Error("The hub did not answer."); }),
]);

// A share link to one collection (manifest.shareable.collection). The hub hands
// out the addresses only when the manifest declares it, and makes links for
// adults only. Whether this household allows sharing at all is answered by the
// panel's first read, which it reports.
const SHARE_SCOPE = "The page shows the collection’s name and description, and each item’s name, notes, the date it was acquired and one photo, which opens at full size. Tags and where things are stored stay in the household. It lists the newest 200 items and shows up to 100 photos. The page is live: whatever anyone in the household adds to this collection or changes in it later appears there too, for as long as the link works. Anyone who gets the link can see it.";
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const canShare = () => share.enabled && isAdult(me);
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share,
  itemType: "collection",
  noun: "collection",
  scopeHtml: () => `${coversCurrent ? "" : "<strong>The photos on the shared page could not be brought up to date just now, so it may show older ones. Close this and press Share again before making a link.</strong> "}${SHARE_SCOPE}`,
  esc,
  glyph,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks,
  expiryChoices: SHARE_EXPIRY_CHOICES,
  defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  getMe: () => me,
  isAdmin: () => window.__IS_ADMIN === true,
  memberName: (id) => memberMap.get(id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

function labelNames() {
  return new Map([...tags, ...locations].map((row) => [row.id, row.name]));
}

/** An error worded for the person reading, which is shown as it is. */
const userError = (message) => Object.assign(new Error(message), { forUser: true });

/** A photo the hub would not take, as against one it could not be asked
 *  about: too large, a type it does not store, no storage left, too many at
 *  once. Its wording for those is shown as it is. */
const uploadRefused = (e) => e?.status === 507 || (e?.status >= 400 && e?.status < 500);

/**
 * Say that something was not saved. Only wording written for the reader is
 * shown (`forUser`: this app's own, or a photo the hub refused); anything else
 * is `line`, and the error itself goes to the console.
 */
function fail(e, line = "Couldn’t save — try again.") {
  if (!e?.forUser) console.error("[collections]", e);
  error = e?.forUser ? e.message : line;
  errorIsLoad = false;
  render();
  // The rows on show are not the rows there are.
  if (e?.elsewhere) void reread();
}

/**
 * A write that changed no row. The hub answers an UPDATE or DELETE that
 * matches nothing with a success, whether the row was deleted on another
 * device or is one this member may not change. Either way what is on show is
 * out of date, so `fail` says so and reads the rows again.
 */
function changedElsewhere() {
  return Object.assign(userError("That was changed or removed somewhere else, so nothing was done here. Showing what is there now."), { elsewhere: true });
}

/** The hub's answer to an UPDATE or DELETE, thrown as `changedElsewhere` when it changed no row. */
function landed(result) {
  if (wroteNothing(result)) throw changedElsewhere();
  return result;
}

/** Say that reading the household's rows failed. Unlike any other error, this
 *  one is taken down again when a later try reads them. */
const ROWS_UNREAD = "Couldn’t load your collections.";
const MEMBERS_UNREAD = "Couldn’t load the household’s members.";
function loadFailed(e, message = ROWS_UNREAD) {
  // An error about something else (an edit that was not saved) is left on
  // show: replaced by this one, it would be taken down with it.
  if (error && !errorIsLoad) return;
  console.error("[collections]", e);
  if (loadErrorsTold.has(message)) return;
  loadErrorsTold.add(message);
  error = message;
  errorIsLoad = true;
  render();
}

// --- Loading -----------------------------------------------------------------
async function loadMembers() {
  let members;
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Casey", role: "child" },
    ];
  } else {
    const res = await answered(fetch(`${CONTEXT}?keys=family.members`));
    // A refusal is not an empty household: thrown, it is tried again.
    const data = res.ok ? await res.json().catch(() => null) : null;
    if (!data || typeof data !== "object") throw new Error("The household's members could not be read.");
    // A 200 can still name a key the hub failed to read: that is a refusal too.
    if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("The household's members could not be read.");
    members = data["family.members"] ?? [];
  }
  memberMap = new Map(members.map((m) => [m.id, m]));
  // Demo mode has no hub to say who is looking: the first sample member is.
  if (!DB_URL) me = HUB_MEMBER ?? members[0];
  membersLoaded = true;
  membersFailure = "";
}

function loadDemo() {
  const at = nowIso();
  collections = [
    { id: "c1", name: "Teddy bears", description: "Every bear in the house.", auto_cutout: 1, created_by: "demo-2", created_at: at, updated_at: at },
    { id: "c2", name: "Power tools", description: "", auto_cutout: 1, created_by: "demo-1", created_at: at, updated_at: at },
  ];
  tags = [
    { id: "t1", collection_id: "c1", name: "Steiff", created_by: "demo-2", created_at: at },
    { id: "t2", collection_id: "c1", name: "Gift", created_by: "demo-2", created_at: at },
    { id: "t3", collection_id: "c2", name: "Cordless", created_by: "demo-1", created_at: at },
  ];
  locations = [
    { id: "l1", name: "Garage", created_by: "demo-1", created_at: at },
    { id: "l2", name: "Bin 1", created_by: "demo-1", created_at: at },
    { id: "l3", name: "Bedroom shelf", created_by: "demo-2", created_at: at },
  ];
  items = [
    { id: "i1", collection_id: "c1", name: "Barnaby", note: "From Grandma.", acquired_date: "2019-12-25", tag_ids: '["t1","t2"]', location_ids: '["l3"]', created_by: "demo-2", created_at: at, updated_at: at },
    { id: "i2", collection_id: "c1", name: "Little Honey", note: "", tag_ids: "[]", location_ids: '["l2"]', created_by: "demo-2", created_at: at, updated_at: at },
    { id: "i3", collection_id: "c2", name: "Drill driver", note: "Two batteries.", tag_ids: '["t3"]', location_ids: '["l1","l2"]', created_by: "demo-1", created_at: at, updated_at: at },
  ];
  photos = [];
}

/**
 * Items and photos arrive a page at a time; read the rest behind the first
 * paint, one request for each round of pages. A round that fails leaves the
 * place it had reached, and the next call carries on from there. One runs at a
 * time; a second call is handed the first's promise.
 */
function loadRest() {
  if (loadedAll) return Promise.resolve();
  if (restLoad) return restLoad;
  const reading = (async () => {
    for (let wanted = nextPageBatch(restPages, restSize); wanted.length; wanted = nextPageBatch(restPages, restSize)) {
      const epoch = readEpoch;
      const results = await answered(db.batch(wanted.map(({ sql, params }) => ({ sql, params }))));
      // The rows were read again from the start while this page was on its
      // way: it carries on from a place that is no longer the place.
      if (epoch !== readEpoch) continue;
      const read = {};
      wanted.forEach(({ name }, i) => {
        const rows = results[i]?.rows ?? [];
        // The page as it was read decides where the next one starts. What is
        // kept of it leaves out anything deleted while it was on its way, and
        // any row already held: one added here moments ago, on a device whose
        // clock is behind, sorts into a page still to come.
        read[name] = rows;
        const held = new Map((name === "items" ? items : photos).map((row) => [row.id, row]));
        const fresh = [];
        for (const row of withoutDeleted(rows, gone)) {
          const mine = held.get(row.id);
          if (!mine) fresh.push(row);
          // Kept from before the rows were read again, and here it is.
          else if (carried[name].delete(row.id)) Object.assign(mine, row);
        }
        if (name === "items") items = [...items, ...fresh];
        else photos = [...photos, ...fresh];
      });
      restPages = read;
      restSize = NEXT_PAGE_SIZE;
      render();
    }
    // Kept from before the rows were read again, and on no page: deleted on
    // another device.
    if (carried.items.size || carried.photos.size) {
      items = items.filter((row) => !carried.items.has(row.id));
      photos = photos.filter((row) => !carried.photos.has(row.id));
      carried = { items: new Set(), photos: new Set() };
      render();
    }
    loadedAll = true;
  })();
  restLoad = reading;
  // Cleared once it settles, and only after it was stored: with nothing left
  // to read the work above is over before this line is reached.
  const clear = () => { if (restLoad === reading) restLoad = null; };
  reading.then(clear, clear);
  return reading;
}

/** Read the first page of everything, and start the later pages from it. */
async function readFirstPage() {
  const named = namedResults(await answered(db.batch(firstRenderBatch())));
  ({ collections, tags, locations } = named);
  // A write on its way holds the row it is changing: see `intoHeld`.
  const kept = { items: carriedOver(items, named.items), photos: carriedOver(photos, named.photos) };
  items = [...intoHeld(items, named.items), ...kept.items];
  photos = [...intoHeld(photos, named.photos), ...kept.photos];
  // Rows a first page does not reach stay until the later pages say whether
  // they are still there: see `carriedOver`.
  carried = { items: new Set(kept.items.map((row) => row.id)), photos: new Set(kept.photos.map((row) => row.id)) };
  loadedAll = false;
  restPages = { items: named.items, photos: named.photos };
  restSize = FIRST_PAGE_SIZE;
  readEpoch++;
}

/**
 * Read every row again, after a write found that a row on show is not what
 * the database holds. The cover sync does the reading: it is what reads the
 * later pages, it runs one at a time, and it tries again if it cannot.
 */
function reread() {
  if (!DB_URL || !firstLoaded) return Promise.resolve();
  rereadOwed = true;
  return syncCovers();
}

/**
 * The first page, read again. A later page already on its way is dropped when
 * it lands (`readEpoch`). The open sheet is closed if what it was open on is
 * gone. Otherwise its boxes take what was read, except those holding
 * someone's words: this runs behind the scenes, while they may be typing.
 */
async function readAgain() {
  // An edit stored while the rows were being read may not be in them: what
  // was read would put the item, and its box, back to the value before. Read
  // once more, until no edit landed in the meantime.
  for (let stored = -1; stored !== itemEdits;) {
    stored = itemEdits;
    await readFirstPage();
  }
  rereadOwed = false;
  if (sheet?.kind === "collection" && sheet.id && !byId(collections, sheet.id)) sheet = null;
  if (sheet?.kind === "new-item" && !byId(collections, sheet.collectionId)) sheet = null;
  if (sheet?.kind !== "item" || !byId(items, sheet.id)) unsaved.clear();
  render();
  refreshSheetBoxes();
}

/**
 * Bring the boxes of the open sheet up to the rows just read. A box is left
 * alone while it is being typed in, and while it holds an edit nobody has
 * stored: an item's on its way to being saved or that failed to save, or a
 * collection's not yet submitted.
 */
function refreshSheetBoxes() {
  const modal = document.getElementById("modal");
  const idle = (el) => el && el !== document.activeElement;
  if (sheet?.kind === "item") {
    const item = byId(items, sheet.id);
    if (!item) return;
    const stored = { name: item.name, note: item.note ?? "", acquired_date: cleanDate(item.acquired_date) ?? "" };
    for (const el of modal.querySelectorAll("[data-item-field]")) {
      const field = el.dataset.itemField;
      const key = `${item.id}|${field}`;
      if (idle(el) && !unsaved.has(key) && !saving.has(key)) el.value = stored[field];
    }
  }
  if (sheet?.kind === "collection" && sheet.id) {
    const collection = byId(collections, sheet.id);
    const form = modal.querySelector("#collection-form");
    if (!collection || !form) return;
    for (const [name, value] of [["name", collection.name], ["description", collection.description ?? ""]]) {
      const el = form.elements[name];
      if (idle(el) && el.value === el.defaultValue) el.value = el.defaultValue = value;
    }
    const check = form.elements.auto_cutout;
    if (idle(check) && check.checked === check.defaultChecked) check.checked = check.defaultChecked = !!Number(collection.auto_cutout);
  }
}

/**
 * Read the first page of everything. One runs at a time, and it is not run
 * again once it has succeeded: a second answer landing after the later pages
 * had begun to arrive would put the rows back to page one and lose the place.
 */
function loadData() {
  if (firstLoaded) return Promise.resolve();
  if (firstLoad) return firstLoad;
  const reading = (async () => {
    if (!DB_URL) { loadDemo(); firstLoaded = true; return; }
    try { await readFirstPage(); } catch (e) { firstLoadFailed = true; throw e; }
    firstLoaded = true;
    firstLoadFailed = false;
  })();
  firstLoad = reading;
  const clear = () => { if (firstLoad === reading) firstLoad = null; };
  reading.then(clear, clear);
  return reading;
}

/**
 * Read everything not read yet: the members, the first page, the later pages.
 * Each part that has been read is not read again, so this is also how a
 * failed launch is tried again. Rejects if any part still could not be read.
 */
async function readAll() {
  // Names are drawn from the members. Reading them failing does not hold up
  // the rows or anything worked out from them, which do not depend on the
  // names: it is said once, and tried again each time this is.
  if (!membersLoaded) {
    await loadMembers().then(render, (e) => { membersFailure = MEMBERS_UNREAD; loadFailed(e, MEMBERS_UNREAD); });
  }
  if (!firstLoaded) { await loadData(); render(); }
  await loadRest();
  // The rows are in. An error about the members stays up while it is true.
  if (errorIsLoad && error !== membersFailure) { error = ""; errorIsLoad = false; render(); }
  if (membersLoaded) loadErrorsTold.clear();
}

async function refresh() {
  error = "";
  // Both are waited for, so the rows are drawn even if the members failed.
  // (A members read that is never answered is given up on by `answered`.)
  const tried = await Promise.allSettled([loadMembers(), loadData()]);
  const failed = tried.find((result) => result.status === "rejected");
  if (failed) {
    console.error("[collections]", failed.reason);
    error = failed === tried[0] ? MEMBERS_UNREAD : ROWS_UNREAD;
    errorIsLoad = true;
    loadErrorsTold.add(error);
    if (tried[0].status === "rejected") membersFailure = MEMBERS_UNREAD;
  }
  if (DB_URL && !me) notice = "You are not here as a member of this household, so nothing can be added or changed.";
  render();
  // Started here, once it is known who is looking: which covers a member may
  // write depends on who they are. It reads whatever is still to come itself,
  // and tries again if it cannot.
  void syncCovers();
}

// --- Collections -------------------------------------------------------------
async function saveCollection(form) {
  const name = form.name.value.trim();
  if (!name) { form.name.focus(); return; }
  const description = form.description.value.trim();
  const autoCutout = form.auto_cutout.checked ? 1 : 0;
  const at = nowIso();
  const existing = sheet.id ? byId(collections, sheet.id) : null;
  // The collection being edited was deleted meanwhile; there is nothing to save.
  if (sheet.id && !existing) { sheet = null; return render(); }
  if (submitting || !me) return;
  submitting = true;
  // The sheet this save was sent from. By the time the hub answers, the person
  // may have closed it and opened another, which this must leave alone.
  const from = sheet;
  try {
    if (existing) {
      landed(await db("UPDATE app_collections__collections SET name = ?, description = ?, auto_cutout = ?, updated_at = ? WHERE id = ?",
        [name, description, autoCutout, at, existing.id]));
      Object.assign(existing, { name, description, auto_cutout: autoCutout, updated_at: at });
    } else {
      const row = { id: crypto.randomUUID(), name, description, auto_cutout: autoCutout, created_by: me.id, created_at: at, updated_at: at };
      await db("INSERT INTO app_collections__collections (id, name, description, auto_cutout, created_by, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?)",
        [row.id, row.name, row.description, row.auto_cutout, row.created_by, row.created_at, row.updated_at]);
      collections = [row, ...collections];
      if (sheet === from) openView({ name: "collection", id: row.id });
    }
    if (sheet === from) sheet = null;
    render();
  } catch (e) { fail(e, "Couldn’t save the collection — try again."); } finally { submitting = false; }
}

async function deleteCollection(id) {
  const collection = byId(collections, id);
  if (!collection) return;
  const count = items.filter((item) => item.collection_id === id).length;
  const ok = await hubConfirm(`Delete "${collection.name}"?`, {
    description: count ? `${plural(count, "item")} and their photos will be deleted with it.` : "",
    confirmLabel: "Delete", destructive: true,
  });
  if (!ok) return;
  try {
    // The hub deletes the items, tags and photos with it, and reclaims the files.
    // A delete that matched no collection may still have taken its items: they
    // are found before it runs. `landed` has the rows read again either way.
    landed(await db("DELETE FROM app_collections__collections WHERE id = ?", [id]));
    gone.collections.add(id);
    collections = collections.filter((row) => row.id !== id);
    items = items.filter((row) => row.collection_id !== id);
    tags = tags.filter((row) => row.collection_id !== id);
    photos = photos.filter((row) => row.collection_id !== id);
    sheet = null;
    openView({ name: "home" });
    render();
  } catch (e) { fail(e, "Couldn’t delete the collection — try again."); }
}

// --- Tags and locations ------------------------------------------------------
/** A new tag or place, and the statement that stores it. Nothing is sent here. */
function newLabel(kind, name, collectionId) {
  const row = { id: crypto.randomUUID(), name: name.trim().replace(/\s+/g, " "), created_by: me.id, created_at: nowIso() };
  if (kind === "tag") {
    row.collection_id = collectionId;
    return { row, insert: {
      sql: "INSERT INTO app_collections__tags (id, collection_id, name, created_by, created_at) VALUES (?, ?, ?, ?, ?)",
      params: [row.id, row.collection_id, row.name, row.created_by, row.created_at] } };
  }
  return { row, insert: {
    sql: "INSERT INTO app_collections__locations (id, name, created_by, created_at) VALUES (?, ?, ?, ?)",
    params: [row.id, row.name, row.created_by, row.created_at] } };
}

async function deleteLabel(kind, id) {
  const rows = kind === "tag" ? tags : locations;
  const row = byId(rows, id);
  if (!row) return;
  const column = kind === "tag" ? "tag_ids" : "location_ids";
  const used = items.filter((item) => parseIds(item[column]).includes(id)).length;
  const ok = await hubConfirm(`Delete "${row.name}"?`, {
    description: used ? `It will come off ${plural(used, "item")}. The items stay.` : "",
    confirmLabel: "Delete", destructive: true,
  });
  if (!ok) return;
  try {
    landed(await db(kind === "tag" ? "DELETE FROM app_collections__tags WHERE id = ?" : "DELETE FROM app_collections__locations WHERE id = ?", [id]));
    if (kind === "tag") tags = tags.filter((other) => other.id !== id);
    else locations = locations.filter((other) => other.id !== id);
    filterTags = filterTags.filter((other) => other !== id);
    filterLocations = filterLocations.filter((other) => other !== id);
    if (view.name === "location" && view.id === id) openView({ name: "home" });
    render();
  } catch (e) { fail(e, kind === "tag" ? "Couldn’t delete the tag — try again." : "Couldn’t delete the place — try again."); }
}

// --- Items -------------------------------------------------------------------
async function createItem(form) {
  const name = form.name.value.trim();
  if (!name) { form.name.focus(); return; }
  if (!byId(collections, sheet.collectionId)) { sheet = null; return render(); }
  if (submitting || !me) return;
  submitting = true;
  const from = sheet;
  const at = nowIso();
  const row = { id: crypto.randomUUID(), collection_id: sheet.collectionId, name, note: "", acquired_date: null, tag_ids: "[]", location_ids: "[]", cover_file_ids: "", created_by: me.id, created_at: at, updated_at: at };
  try {
    await db("INSERT INTO app_collections__items (id, collection_id, name, note, tag_ids, location_ids, created_by, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
      [row.id, row.collection_id, row.name, row.note, row.tag_ids, row.location_ids, row.created_by, row.created_at, row.updated_at]);
    items = [row, ...items];
    if (sheet === from) sheet = { kind: "item", id: row.id };
    render();
  } catch (e) { fail(e, "Couldn’t add the item — try again."); } finally { submitting = false; }
}

// One statement per column an item can have changed, spelled out so that
// scenarios.json can replay each of them against the hub.
const ITEM_UPDATES = {
  name: "UPDATE app_collections__items SET name = ?, updated_at = ? WHERE id = ?",
  note: "UPDATE app_collections__items SET note = ?, updated_at = ? WHERE id = ?",
  acquired_date: "UPDATE app_collections__items SET acquired_date = ?, updated_at = ? WHERE id = ?",
  tag_ids: "UPDATE app_collections__items SET tag_ids = ?, updated_at = ? WHERE id = ?",
  location_ids: "UPDATE app_collections__items SET location_ids = ?, updated_at = ? WHERE id = ?",
};

async function updateItem(id, column, value) {
  const item = byId(items, id);
  if (!item) return;
  const at = nowIso();
  landed(await db(ITEM_UPDATES[column], [value, at, id]));
  itemEdits++;
  Object.assign(item, { [column]: value, updated_at: at });
}

/** Run a write to an item after every one before it has been saved. */
function queueItemWrite(work) {
  itemWrites = itemWrites.then(work).then(render, fail);
  return itemWrites;
}

/**
 * A person changed an item's name, notes or date. An edit that could not be
 * saved stays in its box, marked, and is tried again when the box is left or
 * the sheet closed: the box never passes for saved while it is not. If the
 * sheet has moved on by the time the save fails, the error is all that is left.
 */
function saveItemField(itemId, column, value) {
  const key = `${itemId}|${column}`;
  // From here, not from when its turn comes: the rows can be read again while
  // it waits behind an earlier edit.
  saving.set(key, (saving.get(key) ?? 0) + 1);
  const settled = () => {
    const left = saving.get(key) - 1;
    if (left > 0) saving.set(key, left);
    else saving.delete(key);
  };
  return queueItemWrite(async () => {
    const item = byId(items, itemId);
    try {
      // Compared here, not when the box changed: by now every earlier edit has
      // been stored, so this is the value the edit would actually replace.
      if (!item || (item[column] ?? null) === value) { unsaved.delete(key); return; }
      await updateItem(itemId, column, value);
      unsaved.delete(key);
    } catch (e) {
      unsaved.delete(key);
      // Changed elsewhere: the sheet is about to be drawn again from the rows.
      if (e.elsewhere) throw e;
      // The sheet has moved on, and the box with it.
      console.error("[collections]", e);
      if (sheet?.kind !== "item" || sheet.id !== itemId) throw userError(`An edit to "${item.name}" could not be saved.`);
      unsaved.add(key);
      throw userError("That edit is not saved yet. It is tried again when you leave the box or close this.");
    } finally {
      settled();
    }
  });
}

/** What a name, notes or date box holds, as it would be stored. */
function fieldValue(el) {
  // A date is stored as a day or as nothing; a half-typed one is nothing yet.
  return el.dataset.itemField === "acquired_date" ? cleanDate(el.value) : el.value.trim();
}

/** Save what a box of the open item holds. */
function saveItemBox(el) {
  const item = byId(items, sheet.id);
  if (!item) return;
  const value = fieldValue(el);
  // An item always has a name; an emptied box goes back to the one it had.
  if (el.dataset.itemField === "name" && !value) {
    el.value = item.name;
    unsaved.delete(`${item.id}|name`);
    return markUnsaved();
  }
  void saveItemField(item.id, el.dataset.itemField, value);
}

/** Mark the boxes of the open sheet that hold an edit not yet saved. */
function markUnsaved() {
  for (const el of document.querySelectorAll("#modal [data-item-field]")) {
    const dirty = sheet?.kind === "item" && unsaved.has(`${sheet.id}|${el.dataset.itemField}`);
    if (dirty) el.setAttribute("aria-invalid", "true");
    else el.removeAttribute("aria-invalid");
  }
}

async function setItemLabel(itemId, kind, labelId, want) {
  const item = byId(items, itemId);
  if (!item) return;
  const column = kind === "tag" ? "tag_ids" : "location_ids";
  const rows = kind === "tag" ? tags : locations;
  // Saved through liveIds, so the ids of deleted tags leave the column here.
  const current = liveIds(parseIds(item[column]), rows);
  const on = current.includes(labelId);
  if (want === on) return;
  await updateItem(itemId, column, JSON.stringify(toggleId(current, labelId)));
}

function toggleItemLabel(itemId, kind, labelId) {
  return queueItemWrite(() => {
    const item = byId(items, itemId);
    if (!item) return;
    const on = parseIds(item[kind === "tag" ? "tag_ids" : "location_ids"]).includes(labelId);
    return setItemLabel(itemId, kind, labelId, !on);
  });
}

/** `box` is the text box the name was typed in; it is emptied once the name is
 *  saved, and keeps what was typed if the save fails. */
function addItemLabel(itemId, kind, name, box) {
  if (!name.trim()) return;
  const saved = () => { if (box?.value === name) box.value = ""; };
  return queueItemWrite(async () => {
    const item = byId(items, itemId);
    if (!item) return;
    const existing = findByName(kind === "tag" ? tagsOf(tags, item.collection_id) : locations, name);
    if (existing) {
      await setItemLabel(itemId, kind, existing.id, true);
      return saved();
    }
    // The new tag and the item that carries it are written together: one
    // request, and no tag left behind with nothing wearing it. `requireChanges`
    // is what makes that true when the item has been deleted elsewhere: an
    // UPDATE that matches no row is otherwise a success, and the tag would stay.
    const { row, insert } = newLabel(kind, name, item.collection_id);
    const column = kind === "tag" ? "tag_ids" : "location_ids";
    const next = JSON.stringify([...liveIds(parseIds(item[column]), kind === "tag" ? tags : locations), row.id]);
    const at = nowIso();
    try {
      await db.batch([insert, { sql: ITEM_UPDATES[column], params: [next, at, itemId], requireChanges: true }]);
    } catch (e) {
      throw /stale/i.test(e.message) ? changedElsewhere() : e;
    }
    if (kind === "tag") tags = [...tags, row];
    else locations = [...locations, row];
    Object.assign(item, { [column]: next, updated_at: at });
    saved();
  });
}

async function deleteItem(id) {
  const item = byId(items, id);
  if (!item) return;
  const ok = await hubConfirm(`Delete "${item.name}"?`, { description: "Its photos are deleted with it.", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  try {
    landed(await db("DELETE FROM app_collections__items WHERE id = ?", [id]));
    gone.items.add(id);
    items = items.filter((row) => row.id !== id);
    photos = photos.filter((row) => row.item_id !== id);
    sheet = null;
    render();
  } catch (e) { fail(e, "Couldn’t delete the item — try again."); }
}

// --- The picture a shared page shows -----------------------------------------
const COVER_RETRY_MS = 30_000;

/**
 * Store, on each item, the one picture a shared page shows for it. Called
 * whenever a photo is added, removed, cut out or switched, when the app is
 * opened, and before the share panel opens. Only an adult's visit writes any:
 * a change a child makes waits for an adult to open the app, which runs this
 * too. For anyone else this only reads the rows that are still to come.
 *
 * Calls run one after another. Resolves to whether every cover this member may
 * write is now stored, and never rejects. When it is not (the rows are not all
 * read yet, or a write failed) it is tried again shortly, and again when the
 * tab is next looked at.
 */
function syncCovers() {
  coverSync = coverSync.then(async () => {
    if (!DB_URL) return true;
    try {
      try {
        if (rereadOwed) await readAgain();
        await readAll();
      } catch (e) {
        loadFailed(e);
        throw e;
      }
      // Not every row read: nothing can be worked out, and saying "current"
      // would be a guess.
      if (!loadedAll) throw new Error("not ready");
      // Only an adult writes a cover, of any item: the manifest lets nobody
      // else write the column (row_policies.items.column_write_acls), since
      // whatever file it names is served to anyone holding a share link.
      for (const group of coverWrites(isAdult(me) ? items : [], photos)) {
        try {
          // All or none: a write that matches no row is an item deleted on
          // another device, and the rows are read again before any is retried.
          await answered(db.batch(group.map(({ id, value }) => ({ sql: "UPDATE app_collections__items SET cover_file_ids = ? WHERE id = ?", params: [value, id], requireChanges: true }))));
        } catch (e) {
          if (/stale/i.test(e.message) && !coverMissRead) { coverMissRead = true; void reread(); }
          throw e;
        }
        for (const { id, value } of group) {
          const item = byId(items, id);
          if (item) item.cover_file_ids = value;
        }
      }
      coversCurrent = true;
      coverMissRead = false;
      void fillCutoutThumbs();
    } catch {
      coversCurrent = false;
      if (!coverRetry) coverRetry = setTimeout(() => { coverRetry = 0; if (!document.hidden) void syncCovers(); }, COVER_RETRY_MS);
    }
    return coversCurrent;
  });
  return coverSync;
}

// How long Share waits for the covers before opening the panel anyway.
const SHARE_WAIT_MS = 4_000;

/**
 * Open the share panel for a collection, with its covers brought up to date
 * first so the page a new link opens is already right. A link must always be
 * revocable, so the panel opens whatever happens: if the covers could not be
 * stored, or are still being stored after a few seconds (a large household's
 * first visit writes one for every item), it opens saying so.
 */
async function openShare(id) {
  if (!canShare() || !byId(collections, id) || sharing) return;
  sharing = true;
  render();
  let current = false;
  try {
    current = await Promise.race([syncCovers(), wait(SHARE_WAIT_MS).then(() => false)]);
  } finally {
    sharing = false;
  }
  if (!current) coversCurrent = false;
  // The wait can be long enough to have gone somewhere else.
  const collection = byId(collections, id);
  if (collection && !sheet && view.name === "collection" && view.id === id) {
    shareUi.open({ id: collection.id, title: collection.name });
  }
  render();
}

// --- Photos ------------------------------------------------------------------
/** Upload a photo and, in the same request, the small copy the grid draws.
 *  The hub keeps that copy with the photo: it is deleted with it and opens
 *  for the same people. None comes back when the picture is already small or
 *  the browser cannot decode it. */
async function uploadPatiently(file) {
  for (let attempt = 0; ; attempt++) {
    try {
      return await files.upload(file, { thumbnail: true });
    } catch (e) {
      // The status is there on a current hub; the wording covers an older one.
      if (attempt >= RATE_LIMIT_RETRIES || !(e.status === 429 || /too many requests/i.test(e.message))) throw e;
      await wait(RATE_LIMIT_PAUSE_MS);
    }
  }
}

/**
 * Delete a stored file that no row names. Resolves to whether it is gone, and
 * never rejects. The hub counts a delete against the same per-minute limit as
 * an upload, so one refused for that is made again after a pause: nothing else
 * would ever remove the file.
 */
async function deleteFile(id) {
  for (let attempt = 0; ; attempt++) {
    const res = await fetch(files.url(id), { method: "DELETE" }).catch(() => null);
    // Already gone is gone.
    if (res?.ok || res?.status === 404) return true;
    if (res?.status !== 429 || attempt >= RATE_LIMIT_RETRIES) {
      console.warn(`[collections] file ${id} could not be deleted (${res?.status ?? "no answer"}); nothing names it.`);
      return false;
    }
    await wait(RATE_LIMIT_PAUSE_MS);
  }
}

/** Why a HEIC photo was not added. */
const notConverted = (file) => userError(`"${file.name}" is a HEIC photo, which could not be turned into a JPEG here. Add it from Safari, or save it as a JPEG first.`);

/**
 * Upload a picked photo. A HEIC photo comes back stored as a JPEG: the hub's
 * upload redraws it in a browser that can read it, and the hub converts one
 * that arrives unread when it can. One that is still a HEIC after both is not
 * kept, for three reasons: only Safari can show it, the hub does not remove
 * the location it carries, and no cutout can be made from it.
 *
 * The redrawing is done here, ahead of the upload, so that a JPEG the hub
 * refuses is reported as what it is. Left to the upload, a JPEG refused for
 * its size is followed by the HEIC it came from, and all that could be said
 * of the HEIC then stored is that it was not converted.
 */
async function uploadPhoto(picked) {
  const heic = isHeic(picked);
  // The photo itself when it is no HEIC, or when this browser cannot read one.
  const sending = heic ? await heicAsJpeg(picked) : picked;
  const uploaded = await uploadPatiently(sending).catch((e) => {
    if (!heic) throw e;
    const worded = sending !== picked ? heicRefusal(picked.name, e.status) : null;
    if (worded) throw userError(worded);
    if (sending !== picked) throw e;
    // A HEIC file the browser gave no type is refused as an unknown type.
    throw e.status === 415 ? notConverted(picked) : e;
  });
  if (!storedAsHeic(uploaded, sending)) return uploaded;
  await deleteFile(uploaded.id);
  const refusal = heicKeptRefusal(picked.name, uploaded);
  throw refusal ? userError(refusal) : notConverted(picked);
}

/**
 * Where a new photo of an item goes: after every photo the database holds of
 * it. Asked of the database, because the photos held here can be fewer: the
 * later pages may not be in yet, and another device may have added some. The
 * count held here is the answer when the database cannot be asked.
 */
async function nextSortOrder(itemId) {
  const held = photosOf(photos, itemId).length;
  try {
    const { rows } = await db("SELECT COALESCE(MAX(sort_order), -1) + 1 AS next_order FROM app_collections__photos WHERE item_id = ?", [itemId]);
    const next = Number(rows[0]?.next_order);
    return Number.isInteger(next) && next >= 0 ? next : held;
  } catch {
    return held;
  }
}

async function addOnePhoto(item, picked) {
  const collection = byId(collections, item.collection_id);
  const uploaded = await uploadPhoto(picked);
  const fileId = uploaded.id;
  // A photo without a thumbnail is still a photo; the grid draws the original.
  const thumbFileId = uploaded.thumbnailId ?? null;
  const discard = async () => {
    // No row names the photo, so nothing else will ever reclaim it. Its
    // thumbnail goes with it.
    await deleteFile(fileId);
  };
  const sortOrder = await nextSortOrder(item.id);
  // The item or its collection was deleted while the photo was on its way up.
  if (!byId(items, item.id)) { await discard(); return false; }
  // A picture of a kind the hub makes no cutout from (a GIF) is never asked
  // about, and its row says so from the start.
  const cuttable = cutoutSupported(uploaded.mimeType ?? picked.type);
  const wantsCutout = cuttable && !!Number(collection?.auto_cutout) && !cutoutsStopped;
  const at = nowIso();
  const row = {
    id: crypto.randomUUID(), collection_id: item.collection_id, item_id: item.id, file_id: fileId, thumb_file_id: thumbFileId,
    cutout_file_id: null, cutout_status: wantsCutout ? "pending" : cuttable ? "none" : "unsupported", cutout_requested_at: wantsCutout ? at : null,
    use_cutout: 1, sort_order: sortOrder, created_by: me.id, created_at: at,
  };
  try {
    await db("INSERT INTO app_collections__photos (id, collection_id, item_id, file_id, thumb_file_id, cutout_file_id, cutout_status, cutout_requested_at, use_cutout, sort_order, created_by, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)",
      [row.id, row.collection_id, row.item_id, row.file_id, row.thumb_file_id, row.cutout_file_id, row.cutout_status, row.cutout_requested_at, row.use_cutout, row.sort_order, row.created_by, row.created_at]);
  } catch (e) {
    // A refused write and a write whose answer was lost both land here, and
    // only the first leaves the files unnamed. Look before deleting: removing
    // the files of a row that was in fact stored would leave a broken photo.
    const stored = await photoRowStored(row.id);
    if (stored === false) await discard();
    if (stored !== true) throw e;
  }
  photos = [row, ...photos];
  if (wantsCutout) { mine.set(row.id, at); queueCutout(row.id); }
  return true;
}

async function addPhotos(itemId, fileList) {
  // A HEIC file can arrive with no type at all, so it is known by its name too.
  const picked = [...fileList].filter((file) => file.type.startsWith("image/") || isHeic(file));
  if (!byId(items, itemId) || !files || !me || !picked.length || adding) return;
  adding = { done: 0, total: picked.length };
  render();
  const refused = [];
  for (const file of picked) {
    const item = byId(items, itemId);
    if (!item) break;
    try {
      // One photo the hub will not take (a type it does not store, a file too
      // large) does not stop the ones after it.
      if (!(await addOnePhoto(item, file))) break;
    } catch (e) {
      // What this app says of a photo, and what the hub says of one it will
      // not take, are shown as worded. Anything else is not.
      if (!e?.forUser) console.error("[collections]", e);
      refused.push(e?.forUser || uploadRefused(e) ? e.message : "");
    }
    adding.done++;
    render();
  }
  if (refused.length) {
    errorIsLoad = false;
    const why = refused[refused.length - 1];
    if (refused.length === 1 && picked.length === 1) error = why || "Couldn’t add the photo — try again.";
    else error = why ? `${plural(refused.length, "photo")} could not be added: ${why}` : `Couldn’t add ${plural(refused.length, "photo")} — try again.`;
  }
  adding = null;
  void syncCovers();
  render();
}

async function deletePhoto(id) {
  const ok = await hubConfirm("Delete this photo?", { confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  try {
    // The hub reclaims the photo, its thumbnail and its cutout with the row.
    landed(await db("DELETE FROM app_collections__photos WHERE id = ?", [id]));
    gone.photos.add(id);
    photos = photos.filter((row) => row.id !== id);
    mine.delete(id);
    void syncCovers();
    render();
  } catch (e) { fail(e, "Couldn’t delete the photo — try again."); }
}

/** Stop showing a photo that turned out to have been deleted somewhere else. */
function forgetPhoto(id) {
  gone.photos.add(id);
  photos = photos.filter((row) => row.id !== id);
  mine.delete(id);
  void syncCovers();
}

async function setUseCutout(id, value) {
  const photo = byId(photos, id);
  if (!photo) return;
  try {
    const { changed } = await db("UPDATE app_collections__photos SET use_cutout = ? WHERE id = ?", [value, id]);
    if (changed === 0) {
      // Nothing was switched. If the photo was deleted somewhere else, stop
      // showing it: a cover worked out from it would name a file that is gone.
      if ((await photoRowStored(id)) === false) forgetPhoto(id);
      return render();
    }
    photo.use_cutout = value;
    void syncCovers();
    render();
  } catch (e) { fail(e, "Couldn’t switch the picture — try again."); }
}

// --- Cutouts -----------------------------------------------------------------
// One at a time: each is a file request against the per-minute limit, and a
// queue is what lets a refusal that applies to all of them stop the rest.
//
// The hub keeps one cutout for a photo. Asking again for a photo that has one
// returns the same file and spends nothing, and a request that arrives while
// another is making it is told to ask again in a few seconds. So the hold on a
// row is not what protects the month's allowance. It keeps two tabs from both
// working on a photo, and says which of them writes the answer.
function queueCutout(photoId) {
  cutoutChain = cutoutChain.then(() => makeCutout(photoId)).catch(() => {});
}

/** Settle a request this tab holds. Writes only while the row is still ours. */
async function setCutoutStatus(photo, status, stamp) {
  photo.cutout_status = status;
  await db("UPDATE app_collections__photos SET cutout_status = ? WHERE id = ? AND cutout_file_id IS NULL AND cutout_requested_at = ?",
    [status, photo.id, stamp]).catch(() => {});
}

/** Read a photo's cutout columns again: the cutout, its small copy, where the
 *  request stands and which picture is shown. Resolves to whether its row is there. */
async function reloadCutout(photo) {
  const { rows } = await db("SELECT cutout_file_id, cutout_thumb_file_id, cutout_status, cutout_requested_at, use_cutout FROM app_collections__photos WHERE id = ?", [photo.id]);
  if (rows[0]) Object.assign(photo, rows[0]);
  return rows.length > 0;
}

/** Whether a photo's row is in the database: true, false, or null when that
 *  could not be found out. */
async function photoRowStored(id) {
  try {
    const { rows } = await db("SELECT cutout_file_id, cutout_thumb_file_id, cutout_status, cutout_requested_at, use_cutout FROM app_collections__photos WHERE id = ?", [id]);
    return rows.length > 0;
  } catch {
    return null;
  }
}

/** A person asked for a cutout of one photo. */
async function requestCutout(photoId) {
  const photo = byId(photos, photoId);
  if (!photo || !files || mine.has(photoId) || !canRequestCutout(photo)) return;
  const at = nowIso();
  const staleBefore = new Date(Date.now() - PENDING_TIMEOUT_MS).toISOString();
  try {
    // Take the row only if nobody else holds it, so two tabs pressing the
    // button do not both wait on the same photo.
    const { changed } = await db(
      "UPDATE app_collections__photos SET cutout_status = 'pending', cutout_requested_at = ? WHERE id = ? AND cutout_file_id IS NULL AND (cutout_status != 'pending' OR cutout_requested_at IS NULL OR cutout_requested_at < ?)",
      [at, photoId, staleBefore]);
    if (changed === 0) {
      // Someone else holds it, or has finished it: show what the row says. A
      // cutout learned of here changes the item's cover.
      if (await reloadCutout(photo)) void syncCovers();
      else forgetPhoto(photoId);
      return render();
    }
  } catch (e) { return fail(e, "Couldn’t start the cutout — try again."); }
  Object.assign(photo, { cutout_status: "pending", cutout_requested_at: at });
  mine.set(photoId, at);
  cutoutsStopped = false;
  render();
  queueCutout(photoId);
}

/**
 * Store the small copy of a cutout on the row that names the cutout, and only
 * on that row. If the write is lost the cutout is drawn whole, the hub still
 * removes the copy with it, and `fillCutoutThumbs` makes it up on a later visit.
 */
async function nameCutoutThumb(photo, made) {
  if (!made.thumbnailId) return;
  const named = await db(
    "UPDATE app_collections__photos SET cutout_thumb_file_id = ? WHERE id = ? AND cutout_file_id = ?",
    [made.thumbnailId, photo.id, made.id]).then((result) => result.changed !== 0, () => false);
  if (named) photo.cutout_thumb_file_id = made.thumbnailId;
}

// Two requests to the hub's files for each photo made up, against the thirty
// a minute it allows a member. This pace uses half of them at most.
const THUMB_FILL_PAUSE_MS = 8_000;

/**
 * Make up the small copies of cutouts that have none, for the photos this
 * member added: the hub lets only a photo's owner (or an adult) add one. A
 * copy goes missing when the request that stores it is refused or lost, which
 * a burst of new photos brings about, and the grid then draws each of those
 * cutouts at full size.
 *
 * The hub is asked for the photo's cutout again. It keeps one for a photo, so
 * it hands back the one it holds, spends none of the month's allowance, and
 * stores no second file; the small copy is drawn from that and kept beside it.
 * A row whose cutout the hub no longer holds is not one to ask about, and no
 * row here should be: a cutout goes only with its photo.
 *
 * One at a time and slowly, behind new photos, which need the same allowance
 * of requests. Any refusal ends it for the visit; the next visit starts again.
 */
async function fillCutoutThumbs() {
  if (thumbsFilling || thumbsStopped || !files || !me) return;
  thumbsFilling = true;
  try {
    for (const { id } of missingCutoutThumbs(photos, me, thumbsTried)) {
      while (adding || mine.size) await wait(THUMB_FILL_PAUSE_MS);
      // Looked up now: the rows may have been read again, or the photo deleted.
      const photo = byId(photos, id);
      thumbsTried.add(id);
      if (!photo?.cutout_file_id || photo.cutout_thumb_file_id) continue;
      let made;
      try {
        made = await files.cutout(photo.file_id, { thumbnail: true });
      } catch {
        thumbsStopped = true;
        return;
      }
      if (made?.id === photo.cutout_file_id && made.thumbnailId) {
        await nameCutoutThumb(photo, made);
        render();
      } else {
        // Answered, with nothing to keep: the same answer waits on every visit.
        rememberNoThumb(id);
      }
      await wait(THUMB_FILL_PAUSE_MS);
    }
  } finally {
    thumbsFilling = false;
  }
}

async function makeCutout(photoId) {
  const photo = byId(photos, photoId);
  let stamp = mine.get(photoId);
  if (!stamp) return;
  if (!photo) { mine.delete(photoId); return; }
  try {
    if (cutoutsStopped) {
      await setCutoutStatus(photo, "none", stamp);
      return;
    }
    // Renew the hold before asking. A photo can wait in the queue
    // long enough for its `pending` to look abandoned, and someone else may
    // have taken it since; the row may also be gone. Either way it matches
    // nothing here and the hub is never asked.
    // A hold taken moments ago cannot have been taken by anyone else yet, so
    // the usual case, a photo reached as soon as it is added, skips this.
    if (!holdIsFresh(stamp)) {
      const renewed = nowIso();
      const { changed: held } = await db(
        "UPDATE app_collections__photos SET cutout_requested_at = ? WHERE id = ? AND cutout_file_id IS NULL AND cutout_status = 'pending' AND cutout_requested_at = ?",
        [renewed, photoId, stamp]);
      if (held === 0) {
        if ((await reloadCutout(photo).catch(() => null)) === false) forgetPhoto(photoId);
        return;
      }
      stamp = renewed;
      mine.set(photoId, stamp);
      photo.cutout_requested_at = stamp;
    }

    let made = null;
    let failure = null;
    for (let attempt = 0; !made && !failure; attempt++) {
      try {
        // The hub also keeps a small copy of the cutout, for the shelf and grids.
        made = await files.cutout(photo.file_id, { thumbnail: true });
        // An answer with no file in it is not a reason to ask again.
        if (!made?.id) { made = null; failure = cutoutFailure(undefined); }
      } catch (e) {
        const rateLimited = e.status === 429 && typeof e.detail?.limit !== "number";
        // 409: another request is making this photo's cutout right now. The
        // same question a few seconds on is answered with the one it made.
        const pause = rateLimited ? RATE_LIMIT_PAUSE_MS : e.status === 409 ? CUTOUT_BUSY_PAUSE_MS : 0;
        if (pause && attempt < RATE_LIMIT_RETRIES) await wait(pause);
        else failure = cutoutFailure(e.status, e.detail);
      }
    }
    if (failure) {
      if (failure.stop) cutoutsStopped = true;
      if (failure.message) notice = failure.message;
      await setCutoutStatus(photo, failure.status, stamp);
      return;
    }
    // A write that matches no row is not an error: the hub answers it with
    // zero rows changed. That is the photo having been deleted, or taken by
    // someone else, while the cutout was being made. A write whose answer is
    // lost is a third case: it may have been stored. So the row is read back.
    //
    // The file is the photo's one cutout, not this request's own: whoever
    // took the row is handed the same file by the hub and is about to write
    // its id. So it is deleted only when no row will ever name it, which is
    // when the photo's row is gone, or already names a different cutout. A
    // row that is there and names none is left its file; "Try again" finds it.
    const written = await db(
      "UPDATE app_collections__photos SET cutout_file_id = ?, cutout_status = 'done' WHERE id = ? AND cutout_file_id IS NULL AND cutout_requested_at = ?",
      [made.id, photoId, stamp]).then((result) => result.changed !== 0, () => null);
    if (written) {
      Object.assign(photo, { cutout_file_id: made.id, cutout_status: "done" });
      await nameCutoutThumb(photo, made);
    } else {
      photo.cutout_file_id = null;
      const there = await reloadCutout(photo).catch(() => null);
      if (cutoutIsUnnamed(there, photo.cutout_file_id, made.id)) await deleteFile(made.id);
      // The write landed and its answer was lost: the row names this cutout,
      // and is owed its small copy like any other.
      else if (photo.cutout_file_id === made.id && !photo.cutout_thumb_file_id) await nameCutoutThumb(photo, made);
      if (there === false) forgetPhoto(photoId);
    }
  } finally {
    mine.delete(photoId);
    void syncCovers();
    render();
  }
}

// --- Rendering ---------------------------------------------------------------
function openView(next) {
  view = next;
  filterTags = [];
  filterLocations = [];
  searchQ = "";
}

function picture(photo, { small = false, alt = "" } = {}) {
  if (!photo || !files) return `<span class="placeholder">${glyph("box")}</span>`;
  const cutout = showsCutout(photo) ? ' class="cutout"' : "";
  return `<img${cutout} loading="lazy" decoding="async" src="${esc(files.url(displayFileId(photo, { small })))}" alt="${esc(alt)}" />`;
}

function itemTile(item, names) {
  const cover = coverPhoto(photos, item.id);
  const count = photosOf(photos, item.id).length;
  const places = liveIds(parseIds(item.location_ids), locations).map((id) => names.get(id));
  const showCollection = view.name !== "collection";
  const meta = [showCollection ? byId(collections, item.collection_id)?.name : null, ...places].filter(Boolean).join(" · ");
  return `
    <button class="tile" type="button" data-open-item="${esc(item.id)}">
      <div class="plinth">${picture(cover, { small: true, alt: item.name })}${count > 1 ? `<span class="badge">${count} photos</span>` : ""}</div>
      <div class="tile-body">
        <div class="tile-title">${esc(item.name)}</div>
        ${meta ? `<div class="tile-meta">${esc(meta)}</div>` : ""}
      </div>
    </button>`;
}

function itemGrid(list, emptyText) {
  const names = labelNames();
  const found = searchQ ? list.filter((item) => searchMatch(searchQ, searchableFields(item, names))) : list;
  if (!found.length) {
    return searchQ || filterTags.length || filterLocations.length
      ? `<div class="card empty">${chickadee("searching")}<p>Nothing matches.</p></div>`
      : `<div class="card empty">${chickadee("nest")}<p>${esc(emptyText)}</p></div>`;
  }
  return `<div class="grid">${found.map((item) => itemTile(item, names)).join("")}</div>`;
}

function banners() {
  return `
    ${firstLoadFailed || membersFailure ? `<div class="load-error" data-testid="load-error" role="alert"><span>${firstLoadFailed ? "Couldn’t load your collections." : "Couldn’t load the household’s members."}</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>` : ""}
    ${error && !(firstLoadFailed && errorIsLoad) && error !== membersFailure ? `<div class="error"><span>${esc(error)}</span><button class="dismiss" type="button" data-dismiss="error" aria-label="Dismiss">×</button></div>` : ""}
    ${notice ? `<div class="notice"><span>${esc(notice)}</span><button class="dismiss" type="button" data-dismiss="notice" aria-label="Dismiss">×</button></div>` : ""}`;
}

function searchRow(placeholder) {
  return `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="${esc(placeholder)}" aria-label="Search" value="${esc(searchQ)}" /></div>`;
}

function homeList() {
  if (searchQ) return itemGrid(items, "");
  // Not "no collections yet": they have not been read, and may be many.
  if (!firstLoaded) return firstLoadFailed ? "" : `<div class="card empty"><p>Loading…</p></div>`;
  if (!collections.length) {
    return `<div class="card empty">${chickadee("nest")}<p>No collections yet. Start one for anything you keep more than a few of.</p></div>`;
  }
  return `<div class="grid">${collections.map((collection) => {
    const count = items.filter((item) => item.collection_id === collection.id).length;
    return `
      <button class="tile" type="button" data-open-collection="${esc(collection.id)}">
        <div class="plinth">${picture(collectionCover(items, photos, collection.id), { small: true, alt: collection.name })}</div>
        <div class="tile-body">
          <div class="tile-title">${esc(collection.name)}</div>
          <div class="tile-meta">${esc(plural(count, "item"))}</div>
        </div>
      </button>`;
  }).join("")}</div>`;
}

function renderHome() {
  const counts = countByLabel(items, "location_ids");
  return `
    <div class="topbar">
      <div class="topbar-main"><h1>Collections</h1></div>
      ${firstLoaded && me ? `<button class="btn" type="button" data-new-collection>${glyph("plus")} New collection</button>` : ""}
    </div>
    ${banners()}
    ${items.length ? searchRow("Search every collection…") : ""}
    <section id="list">${homeList()}</section>
    ${locations.length ? `
      <h2>Where things are</h2>
      <div class="chips">${locations.map((location) =>
        `<button class="chip" type="button" data-open-location="${esc(location.id)}">${esc(location.name)} <span class="count">${counts.get(location.id) ?? 0}</span></button>`).join("")}
      </div>` : ""}`;
}

function collectionList() {
  return itemGrid(filterItems(items, { collectionId: view.id, tagIds: filterTags, locationIds: filterLocations }),
    "Nothing in this collection yet.");
}

function renderCollection() {
  const collection = byId(collections, view.id);
  if (!collection) { openView({ name: "home" }); return renderHome(); }
  const inside = items.filter((item) => item.collection_id === collection.id);
  const tagCounts = countByLabel(inside, "tag_ids");
  const locationCounts = countByLabel(inside, "location_ids");
  const usedTags = tagsOf(tags, collection.id).filter((tag) => tagCounts.has(tag.id));
  const usedLocations = locations.filter((location) => locationCounts.has(location.id));
  const chip = (kind, row, on, count) =>
    `<button class="chip${on ? " on" : ""}" type="button" data-filter-${kind}="${esc(row.id)}" aria-pressed="${on}">${esc(row.name)} <span class="count">${count}</span></button>`;
  return `
    <button class="back" type="button" data-home>‹ Collections</button>
    <div class="topbar">
      <div class="topbar-main">
        <h1>${esc(collection.name)}</h1>
        <p class="muted tiny">${esc([collection.description, plural(inside.length, "item"), `started by ${memberName(collection.created_by)}`].filter(Boolean).join(" · "))}</p>
      </div>
      <div class="row">
        ${canShare() ? `<button class="btn btn-ghost btn-sm" type="button" data-testid="collection-share" data-share-collection="${esc(collection.id)}"${sharing ? " disabled" : ""}>${sharing ? "Sharing…" : "Share"}</button>` : ""}
        ${canEdit(collection) ? `<button class="btn btn-ghost btn-sm" type="button" data-edit-collection="${esc(collection.id)}">${glyph("pencil")} Edit</button>` : ""}
        ${me ? `<button class="btn" type="button" data-new-item="${esc(collection.id)}">${glyph("plus")} Add item</button>` : ""}
      </div>
    </div>
    ${banners()}
    ${inside.length ? searchRow(`Search ${collection.name}…`) : ""}
    ${usedTags.length || usedLocations.length ? `
      <div class="filters">
        ${usedTags.length ? `<div class="filter-line"><span class="label">Tags</span><div class="chips">${usedTags.map((tag) => chip("tag", tag, filterTags.includes(tag.id), tagCounts.get(tag.id))).join("")}</div></div>` : ""}
        ${usedLocations.length ? `<div class="filter-line"><span class="label">Where</span><div class="chips">${usedLocations.map((location) => chip("location", location, filterLocations.includes(location.id), locationCounts.get(location.id))).join("")}</div></div>` : ""}
      </div>` : ""}
    <section id="list">${collectionList()}</section>`;
}

function locationList() {
  return itemGrid(filterItems(items, { locationIds: [view.id] }), "Nothing is stored here yet.");
}

function renderLocation() {
  const location = byId(locations, view.id);
  if (!location) { openView({ name: "home" }); return renderHome(); }
  return `
    <button class="back" type="button" data-home>‹ Collections</button>
    <div class="topbar">
      <div class="topbar-main"><h1>${esc(location.name)}</h1><p class="muted tiny">Everything stored here, from every collection.</p></div>
      ${canEdit(location) ? `<button class="btn btn-quiet-danger" type="button" data-delete-location="${esc(location.id)}">Delete place</button>` : ""}
    </div>
    ${banners()}
    ${searchRow(`Search ${location.name}…`)}
    <section id="list">${locationList()}</section>`;
}

function listHtml() {
  if (view.name === "collection") return collectionList();
  if (view.name === "location") return locationList();
  return homeList();
}

function collectionSheet() {
  const collection = sheet.id ? byId(collections, sheet.id) : null;
  const own = collection ? tagsOf(tags, collection.id) : [];
  return `
    <form class="sheet" id="collection-form">
      <div class="sheet-head"><h1>${collection ? "Edit collection" : "New collection"}</h1><button class="btn btn-ghost btn-sm" type="button" data-close>Close</button></div>
      <div data-region="banners">${banners()}</div>
      <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" type="text" maxlength="80" placeholder="Teddy bears" value="${esc(collection?.name ?? "")}" required data-autofocus /></div>
      <div class="field"><label for="c-desc">Description</label><textarea id="c-desc" name="description" maxlength="400" placeholder="Optional">${esc(collection?.description ?? "")}</textarea></div>
      <label class="check"><input type="checkbox" name="auto_cutout" ${!collection || Number(collection.auto_cutout) ? "checked" : ""} />
        <span>Remove the background from new photos, so each one shows the item alone. The photo as taken is always kept.</span></label>
      <div data-region="collection-tags">${own.length ? `
        <h2>Tags</h2>
        <div class="chips">${own.map((tag) => `<span class="chip static">${esc(tag.name)}${canEdit(tag) ? ` <button class="chip-x" type="button" data-delete-tag="${esc(tag.id)}" aria-label="Delete tag ${esc(tag.name)}">×</button>` : ""}</span>`).join("")}</div>` : ""}</div>
      <div class="sheet-foot">
        ${collection ? `<button class="btn btn-quiet-danger" type="button" data-delete-collection="${esc(collection.id)}">Delete collection</button>` : "<span></span>"}
        <button class="btn" type="submit">${collection ? "Save" : "Create"}</button>
      </div>
    </form>`;
}

function newItemSheet() {
  return `
    <form class="sheet" id="item-form">
      <div class="sheet-head"><h1>Add item</h1><button class="btn btn-ghost btn-sm" type="button" data-close>Close</button></div>
      <div data-region="banners">${banners()}</div>
      <div class="field"><label for="i-name">Name</label><input id="i-name" name="name" type="text" maxlength="120" placeholder="What is it?" required data-autofocus /></div>
      <p class="muted tiny">Photos, tags and where it is stored come next.</p>
      <div class="sheet-foot"><span></span><button class="btn" type="submit">Add</button></div>
    </form>`;
}

function photoCard(photo, item) {
  // Still "pending" while this tab is making it, and while an old request has
  // not been checked: "failed, try again" is only said once that is known.
  const state = mine.has(photo.id) || (DB_URL && needsCheck(photo, mine, checkedStale)) ? "pending" : cutoutState(photo);
  const label = cutoutLabel(state);
  const editable = canEdit(photo);
  const actions = [];
  if (photo.cutout_file_id && editable) {
    actions.push(showsCutout(photo)
      ? `<button class="btn btn-ghost btn-sm" type="button" data-use-cutout="0" data-photo="${esc(photo.id)}">Show as taken</button>`
      : `<button class="btn btn-ghost btn-sm" type="button" data-use-cutout="1" data-photo="${esc(photo.id)}">Show cutout</button>`);
  }
  if (files && editable && state !== "pending" && canRequestCutout(photo)) {
    actions.push(`<button class="btn btn-ghost btn-sm" type="button" data-cutout="${esc(photo.id)}">${state === "none" ? "Remove background" : "Try again"}</button>`);
  }
  if (editable) actions.push(`<button class="btn btn-quiet-danger" type="button" data-delete-photo="${esc(photo.id)}">Delete</button>`);
  return `
