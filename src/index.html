    <div class="photo">
      <div class="plinth">${picture(photo, { alt: item.name })}</div>
      ${label || actions.length ? `<div class="photo-foot">
        ${label ? `<div class="tiny muted">${state === "pending" ? '<span class="spin" aria-hidden="true"></span> ' : ""}${esc(label)}</div>` : ""}
        ${actions.length ? `<div class="row">${actions.join("")}</div>` : ""}
      </div>` : ""}
    </div>`;
}

function labelPicker(item, kind, editable) {
  const column = kind === "tag" ? "tag_ids" : "location_ids";
  const rows = kind === "tag" ? tagsOf(tags, item.collection_id) : locations;
  const chosen = parseIds(item[column]);
  const shown = editable ? rows : rows.filter((row) => chosen.includes(row.id));
  const chips = shown.map((row) => {
    const on = chosen.includes(row.id);
    return editable
      ? `<button class="chip${on ? " on" : ""}" type="button" data-toggle-${kind}="${esc(row.id)}" aria-pressed="${on}">${esc(row.name)}</button>`
      : `<span class="chip static on">${esc(row.name)}</span>`;
  }).join("");
  return `
    <h2>${kind === "tag" ? "Tags" : "Where it is"}</h2>
    <div data-region="${kind}-chips">${chips ? `<div class="chips">${chips}</div>` : editable ? "" : `<p class="muted tiny">None.</p>`}</div>
    ${editable ? `
      <form class="add-inline" data-add-label="${kind}">
        <input type="text" name="name" maxlength="40" placeholder="${kind === "tag" ? "New tag" : "New place, such as Bin 1"}" aria-label="${kind === "tag" ? "New tag" : "New place"}" />
        <button class="btn btn-ghost btn-sm" type="submit">Add</button>
      </form>` : ""}`;
}

function itemSheet() {
  const item = byId(items, sheet.id);
  if (!item) { sheet = null; return ""; }
  const editable = canEdit(item);
  const own = photosOf(photos, item.id);
  return `
    <div class="sheet" role="dialog" aria-label="${esc(item.name)}">
      <div class="sheet-head">
        <div class="topbar-main">
          ${editable ? "" : `<h1>${esc(item.name)}</h1>`}
          <p class="muted tiny">${esc(byId(collections, item.collection_id)?.name ?? "")} · added by ${esc(memberName(item.created_by))}</p>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" data-close>Close</button>
      </div>
      <div data-region="banners">${banners()}</div>
      ${editable ? `
        <div class="field"><label for="d-name">Name</label><input id="d-name" type="text" maxlength="120" value="${esc(item.name)}" data-item-field="name" /></div>
        <div class="field"><label for="d-note">Notes</label><textarea id="d-note" maxlength="2000" placeholder="Where it came from, what makes it special" data-item-field="note">${esc(item.note ?? "")}</textarea></div>
        <div class="field"><label for="d-acquired">Acquired</label><input id="d-acquired" type="date" style="max-width:220px" value="${esc(cleanDate(item.acquired_date) ?? "")}" data-item-field="acquired_date" /></div>`
      : `${item.note ? `<p style="white-space:pre-wrap;margin-bottom:10px">${esc(item.note)}</p>` : ""}
         ${formatDate(item.acquired_date) ? `<p class="muted tiny" style="margin-bottom:10px">Acquired ${esc(formatDate(item.acquired_date))}</p>` : ""}`}
      <h2>Photos</h2>
      <div data-region="photos">
        ${own.length ? `<div class="photos">${own.map((photo) => photoCard(photo, item)).join("")}</div>` : `<p class="muted tiny">No photos yet.</p>`}
        ${files && me ? `
          <div class="row" style="margin-top:10px">
            <button class="btn btn-ghost btn-sm" type="button" data-pick-photos ${adding ? "disabled" : ""}>${glyph("camera")} ${adding ? `Adding ${Math.min(adding.done + 1, adding.total)} of ${adding.total}…` : "Add photos"}</button>
          </div>` : ""}
      </div>
      ${files ? `<input type="file" id="photo-input" multiple accept="image/*" />` : ""}
      ${labelPicker(item, "tag", editable)}
      ${labelPicker(item, "location", editable)}
      ${editable ? `<div class="sheet-foot"><button class="btn btn-quiet-danger" type="button" data-delete-item="${esc(item.id)}">Delete item</button><span></span></div>` : ""}
    </div>`;
}

// What `root` was last given, or null when it has been changed since by hand.
let drawn = null;
let pendingTimer = 0;
let polling = false;
let pollFailed = false;
// Stale requests the database has been asked about and that are truly
// abandoned, by holdKey. Only these read as failed.
const checkedStale = new Set();
const PENDING_POLL_MS = 15_000;

/**
 * Ask how the cutouts other tabs and devices are making have turned out. This
 * tab will never be told, and without asking, a cutout that succeeded elsewhere
 * would sit at "Removing the background…" and then read as failed. One batch
 * for all of them.
 */
async function pollPending() {
  const waiting = pendingElsewhere(photos, mine, checkedStale);
  if (!waiting.length || polling) return;
  polling = true;
  try {
    const results = await db.batch(waiting.map((photo) => ({
      sql: "SELECT cutout_file_id, cutout_thumb_file_id, cutout_status, cutout_requested_at, use_cutout FROM app_collections__photos WHERE id = ?", params: [photo.id],
    })));
    waiting.forEach((photo, i) => {
      const row = results[i]?.rows?.[0];
      // Not while this tab has since taken the photo itself.
      if (row && !mine.has(photo.id)) Object.assign(photo, row);
      // Asked, and still an old unanswered request (or the row is gone): now
      // it is known to be abandoned, and is not asked about again. A new hold
      // on it has a new stamp, and so a new key.
      if (needsCheck(photo, mine, checkedStale)) checkedStale.add(holdKey(photo));
    });
    pollFailed = false;
    void syncCovers();
  } catch {
    // Asked again on the next turn of the timer, not at once.
    pollFailed = true;
  } finally {
    polling = false;
  }
}

/**
 * Draw the open sheet. A sheet that is already open is not rebuilt: only its
 * `data-region` parts are redrawn, and those hold no text box. So a cutout
 * finishing, an upload moving on or a note being saved never clears what
 * someone is typing, never loses an edit a rebuilt box would forget, and never
 * sends a long sheet back to the top.
 */
function renderSheet() {
  const modal = document.getElementById("modal");
  const key = sheet ? `${sheet.kind}:${sheet.id ?? sheet.collectionId ?? "new"}` : "";
  const html = !sheet ? "" : sheet.kind === "collection" ? collectionSheet() : sheet.kind === "new-item" ? newItemSheet() : itemSheet();
  if (!html) {
    sheet = null;
    modal.innerHTML = "";
    modal.dataset.sheet = "";
    return;
  }
  if (modal.dataset.sheet !== key) {
    modal.innerHTML = `<div class="overlay" data-overlay>${html}</div>`;
    modal.dataset.sheet = key;
    modal.querySelector("[data-autofocus]")?.focus();
    return;
  }
  const fresh = document.createElement("div");
  fresh.innerHTML = html;
  for (const region of modal.querySelectorAll("[data-region]")) {
    const next = fresh.querySelector(`[data-region="${region.dataset.region}"]`);
    if (next && region.innerHTML !== next.innerHTML) region.innerHTML = next.innerHTML;
  }
  markUnsaved();
}

function render() {
  const root = document.getElementById("root");
  const searching = document.activeElement?.id === "search" ? document.activeElement.selectionStart : null;
  root.className = "";
  const html = view.name === "collection" ? renderCollection() : view.name === "location" ? renderLocation() : renderHome();
  // A redraw that would change nothing is skipped. Rows arrive and cutouts
  // finish behind the scenes, and replacing a button between the press and
  // the release of a click loses the click.
  const changed = html !== drawn;
  if (changed) { root.innerHTML = html; drawn = html; }
  if (changed && searching !== null) {
    const box = document.getElementById("search");
    if (box) { box.focus(); try { box.setSelectionRange(searching, searching); } catch {} }
  }

  renderSheet();

  // While someone else is making a cutout, ask now and then how it went, and
  // redraw. If no answer ever comes the row goes stale, reads as failed with a
  // "Try again", and the asking stops.
  // Set once and left to fire: a timer restarted by every redraw would be put
  // off for as long as the person kept working.
  if (DB_URL && !pendingTimer && !polling && pendingElsewhere(photos, mine, checkedStale).length) {
    // A stale row not yet asked about is being shown on trust; ask at once.
    const urgent = !pollFailed && photos.some((photo) => needsCheck(photo, mine, checkedStale));
    pendingTimer = setTimeout(() => { pendingTimer = 0; pollPending().then(render); }, urgent ? 0 : PENDING_POLL_MS);
  }
}

// --- Events ------------------------------------------------------------------
function toggleFilter(list, id) { return toggleId(list, id); }

/**
 * Close the open sheet. However it is closed, the box being typed in is blurred
 * first: that is what fires its save, and a sheet closed by key or by a click
 * outside it would otherwise drop the edit. A save that fails after this has
 * no box left to stay in, and is reported as an error.
 */
function closeSheet() {
  const typing = document.activeElement;
  if (typing?.dataset?.itemField) typing.blur();
  // An edit that failed to save earlier, in a box since left, has its last try.
  if (sheet?.kind === "item") {
    for (const el of document.querySelectorAll("#modal [data-item-field]")) {
      // The box just left has had its try already, from `focusout`.
      if (el !== typing && unsaved.has(`${sheet.id}|${el.dataset.itemField}`)) saveItemBox(el);
    }
  }
  sheet = null;
  render();
}

// A click outside the sheet closes it, but only a click that also STARTED
// there. Selecting text and letting go past the edge of the sheet is a click
// on the overlay too, and is not a wish to close.
let pressedOverlay = false;
document.addEventListener("mousedown", (event) => { pressedOverlay = event.target.matches("[data-overlay]"); });

document.addEventListener("click", (event) => {
  if (event.target.matches("[data-overlay]")) { if (pressedOverlay) closeSheet(); return; }
  const el = event.target.closest("button");
  if (!el) return;
  const d = el.dataset;
  if ("dismiss" in d) { if (d.dismiss === "error") { error = ""; errorIsLoad = false; } else notice = ""; return render(); }
  // Everything not read yet is read again, in place: the same try the page makes on its own.
  if (d.testid === "load-retry") return void syncCovers();
  if ("close" in d) return closeSheet();
  if ("home" in d) { openView({ name: "home" }); return render(); }
  if ("newCollection" in d) { sheet = { kind: "collection" }; return render(); }
  if (d.openCollection) { openView({ name: "collection", id: d.openCollection }); return render(); }
  if (d.openLocation) { openView({ name: "location", id: d.openLocation }); return render(); }
  if (d.editCollection) { sheet = { kind: "collection", id: d.editCollection }; return render(); }
  if (d.shareCollection) return void openShare(d.shareCollection);
  if (d.deleteCollection) return void deleteCollection(d.deleteCollection);
  if (d.deleteTag) return void deleteLabel("tag", d.deleteTag);
  if (d.deleteLocation) return void deleteLabel("location", d.deleteLocation);
  if (d.newItem) { sheet = { kind: "new-item", collectionId: d.newItem }; return render(); }
  if (d.openItem) { sheet = { kind: "item", id: d.openItem }; return render(); }
  if (d.deleteItem) return void deleteItem(d.deleteItem);
  if (d.filterTag) { filterTags = toggleFilter(filterTags, d.filterTag); return render(); }
  if (d.filterLocation) { filterLocations = toggleFilter(filterLocations, d.filterLocation); return render(); }
  if (d.toggleTag) return void toggleItemLabel(sheet.id, "tag", d.toggleTag);
  if (d.toggleLocation) return void toggleItemLabel(sheet.id, "location", d.toggleLocation);
  if ("pickPhotos" in d) return document.getElementById("photo-input")?.click();
  if (d.cutout) return void requestCutout(d.cutout);
  if (d.useCutout) return void setUseCutout(d.photo, Number(d.useCutout));
  if (d.deletePhoto) return void deletePhoto(d.deletePhoto);
});

document.addEventListener("submit", (event) => {
  const form = event.target;
  event.preventDefault();
  if (form.id === "collection-form") return void saveCollection(form);
  if (form.id === "item-form") return void createItem(form);
  if (form.dataset.addLabel && sheet?.kind === "item") {
    return void addItemLabel(sheet.id, form.dataset.addLabel, form.name.value, form.name);
  }
});

document.addEventListener("change", (event) => {
  const el = event.target;
  if (el.id === "photo-input" && sheet?.kind === "item") {
    const picked = [...el.files];
    // Cleared so that choosing the same photo again is still a change.
    el.value = "";
    void addPhotos(sheet.id, picked);
    return;
  }
  if (el.dataset.itemField && sheet?.kind === "item") saveItemBox(el);
});

// A box left while it holds an edit that failed to save: try the save again.
// (`change` does not fire for it, since nothing in the box has changed since.)
document.addEventListener("focusout", (event) => {
  const el = event.target;
  if (el.dataset?.itemField && sheet?.kind === "item" && unsaved.has(`${sheet.id}|${el.dataset.itemField}`)) saveItemBox(el);
});

// A picture that did not load is asked for again a few times, further apart
// each time. `error` and `load` do not bubble, so both are caught on the way
// down. Counted by address, so that a tile drawn again does not start over.
document.addEventListener("error", (event) => {
  const img = event.target;
  const src = img?.tagName === "IMG" ? img.getAttribute("src") : null;
  if (!src || !FILES_URL || !src.startsWith(FILES_URL)) return;
  // One wait for an address, however many tiles draw it: the others are
  // asked for again with it.
  if (imageWaits.has(src)) return;
  const tries = imageTries.get(src) ?? 0;
  const delay = imageRetryDelay(tries);
  if (delay === null) return;
  imageTries.set(src, tries + 1);
  imageWaits.add(src);
  setTimeout(() => {
    imageWaits.delete(src);
    // Setting the same address again is what makes the browser fetch it again.
    for (const other of document.querySelectorAll("img")) {
      if (other.getAttribute("src") === src && !(other.complete && other.naturalWidth)) other.setAttribute("src", src);
    }
  }, delay);
}, true);
document.addEventListener("load", (event) => {
  if (event.target?.tagName === "IMG") imageTries.delete(event.target.getAttribute("src"));
}, true);

// Re-render only the list on each keystroke so the search box keeps focus.
document.addEventListener("input", (event) => {
  if (event.target.id !== "search") return;
  searchQ = event.target.value;
  const list = document.getElementById("list");
  if (list) list.innerHTML = listHtml();
  drawn = null;
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && sheet) closeSheet();
});

// A tab that was asleep wakes with timers that are late and rows that are old.
// Draw again on the way back in, which asks about anything left unanswered.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  render();
  if (!coversCurrent) void syncCovers();
  // Names that could not be read at the start are asked for again.
  else if (!membersLoaded) void readAll().catch(loadFailed);
});

refresh();
</script>
</body>
</html>
